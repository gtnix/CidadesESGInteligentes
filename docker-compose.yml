services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: gestao-residuos-esg:local
    restart: on-failure
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Development}
      - "ConnectionStrings__DefaultConnection=Server=db,1433;Database=GestaoResiduosESG;User Id=sa;Password=${SA_PASSWORD:-GestaoESG@2026!};TrustServerCertificate=True"
      - "Jwt__Key=${Jwt__Key:-GestaoResiduosESG_SuperSecretKey_MinLength32Chars!}"
      - Jwt__Issuer=${Jwt__Issuer:-GestaoResiduosESG}
      - Jwt__Audience=${Jwt__Audience:-GestaoResiduosESG}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 60s
    networks:
      - esg-network

  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      - ACCEPT_EULA=Y
      - "SA_PASSWORD=${SA_PASSWORD:-GestaoESG@2026!}"
      - MSSQL_PID=Express
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"${SA_PASSWORD:-GestaoESG@2026!}\" -No -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 40s
    networks:
      - esg-network

networks:
  esg-network:
    driver: bridge
    name: ${COMPOSE_PROJECT_NAME:-gestao-esg}_esg-network

volumes:
  sqlserver_data:
